<section class="card">
  <span class="badge">Experiments</span>
  <h2>Attention variants lab</h2>
  <p>
    Run fast experiments that toggle known algorithmic motifs. Results are
    stored for the dashboard.
  </p>
  <div class="grid two">
    <div>
      <div class="slider-row">
        <label for="variant-temp">Softmax temperature</label>
        <input id="variant-temp" type="range" min="0.5" max="2.0" step="0.1" />
        <span id="variant-temp-value">1.0</span>
      </div>
      <div class="slider-row">
        <label for="variant-sparsity">Top-k sparsity</label>
        <input id="variant-sparsity" type="range" min="1" max="3" step="1" />
        <span id="variant-sparsity-value">2</span>
      </div>
      <div class="slider-row">
        <label for="variant-competition">Competition strength</label>
        <input id="variant-competition" type="range" min="0" max="1" step="0.1" />
        <span id="variant-competition-value">0.4</span>
      </div>
      <div class="row">
        <button class="primary" id="variant-run">Run Experiment</button>
        <button id="variant-log">Log Result</button>
      </div>
    </div>
    <div>
      <h3>Variant attention</h3>
    <div class="grid two">
      <pre class="matrix" id="variant-matrix"></pre>
      <div class="network">
        <svg id="variant-network"></svg>
        <p class="muted">Top-k sparsity zeros out edges.</p>
      </div>
    </div>
    </div>
  </div>
</section>

<section class="card">
  <h2>Batch results</h2>
  <canvas class="chart" id="variant-chart"></canvas>
</section>
